# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

# HA's runtime is Python 3.13; targeting py314 makes ruff emit 3.14-only syntax
# (PEP 758 unparenthesized `except A, B:`) that would SyntaxError at import on 3.13.
target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "CPY001", # per-file copyright notice — not a convention for HA integrations
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.per-file-ignores]
# S101 (assert) is pytest's own idiom, not a production security concern — same exemption
# HA core's own pyproject.toml this file is based on carries for its tests directory.
"tests/*" = ["S101"]

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
